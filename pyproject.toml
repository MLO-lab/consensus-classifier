[tool.poetry]
name = "cclf"
version = "0.1.0"
description = "XGBoost based consensus classifier."
readme = "README.md"
authors = ["Arber Qoku <arber.qoku@dkfz-heidelberg.com>"]
homepage = "https://github.com/MLO-lab/consensus-classifier"
repository = "https://github.com/MLO-lab/consensus-classifier"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "<2.1.0"
pandas = "^2.2.3"
scikit-learn = "^1.6.0"
xgboost = "^2.1.3"
tqdm = "^4.67.1"
click = "^8.1.7"
seaborn = "^0.13.2"
